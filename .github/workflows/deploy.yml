name: Godot 4.7.2 Web Build and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: huanghai-pages
  cancel-in-progress: true
jobs:
  build:
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/editor.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/editor.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/godot-export
          unzip -q /tmp/templates.tpz -d /tmp/godot-export
          cp /tmp/godot-export/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --headless --version
      - name: Keep Godot editor build for reproducible debugging
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux-editor
          path: /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import --quit
      - name: Upload tested Godot project source
        uses: actions/upload-artifact@v4
        with:
          name: dev001-godot-source
          path: |
            project.godot
            export_presets.cfg
            scenes/
            scripts/
            tests/
            README.md
      - name: Smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd
      - name: Functional combat and multi-touch tests
        run: godot --headless --path . --script res://tests/functional_test.gd
      - name: Physics hitbox and dodge invulnerability test
        run: godot --headless --path . --script res://tests/collision_test.gd
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          ls -lh build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: dev001-web-export
          path: build/web/
      - name: Publish Web preview (generated branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if git clone -q --single-branch --branch web-preview "$REMOTE" /tmp/web-preview; then
            cd /tmp/web-preview
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            mkdir -p /tmp/web-preview
            cd /tmp/web-preview
            git init -q -b web-preview
            git remote add origin "$REMOTE"
          fi
          cp -a "$GITHUB_WORKSPACE/build/web/." .
          touch .nojekyll
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Build: Godot 4.7.2 Web preview"
            git push -q origin HEAD:refs/heads/web-preview
          fi
      - name: Detect whether GitHub Pages is enabled
        id: pages
        shell: bash
        run: |
          if curl -fsS "https://api.github.com/repos/zbeiqi485-maker/huang-hai-lie-ji/pages" >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not yet enabled; independent Web preview branch has been published."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: build/web
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://zbeiqi485-maker.github.io/huang-hai-lie-ji/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
